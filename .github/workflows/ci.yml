name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test storyboard generation
        run: |
          python -m storyboard --frames 6 --per-page 3 --style grid --project 我的定格动画 --title 分镜纸 -o storyboard.html
          python -c 'page=open("storyboard.html", encoding="utf-8").read(); assert page.count("<section") == 2; assert "第 1 / 2 页" in page; assert "第 2 / 2 页" in page; assert "共 6 格" in page; assert page.count("画面说明") == 6; assert page.count("时长（秒）") == 6; assert "4:3" in page; assert "远景" in page'
          python -m storyboard --frames 24 --per-page 6 --style grid --ratio 16:9 --project 我的短片 --title 分镜练习 -o storyboard-169.html
          python -c 'page=open("storyboard-169.html", encoding="utf-8").read(); assert page.count("<section") == 4; assert "第 4 / 4 页" in page; assert "共 24 格" in page; assert "16:9" in page; assert ">24<" in page'
